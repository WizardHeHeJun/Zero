# Conda 环境定义 —— 情感表达多 Agent 系统（affective-expression）
#
# 重建：  conda env create -f environment.yml
# 激活：  conda activate affective-expression
# 更新：  conda env update -f environment.yml --prune
#
# 依赖口径与 pyproject.toml 对齐（loose 约束、跨平台可重建）。
# 含 核心 + dev + **常用 optional extra（ml/llm/nlp/steer）** —— 重建即得可跑真 LLM 对话/真网络化
# 训练/steering 的完整环境，无需再手动装 extra。
# db（Postgres/Neo4j saver）与 graphiti（语义知识图谱）属部署/重型可选，**按需**手动装：
#   pip install -e ".[db]"   /   pip install -e ".[graphiti]"
# 本机 win-64 实测的精确版本见 environment.lock.yml。
name: affective-expression
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      # 运行依赖（= pyproject [project].dependencies）
      - langgraph>=0.2
      - pydantic>=2
      # 开发工具（= pyproject [dependency-groups].dev）
      - pytest>=8
      - pytest-asyncio>=0.23
      - ruff
      - mypy
      # ── 常用 optional extra（= pyproject [project.optional-dependencies]）──
      # ml：真网络化解码器（韵律/生理/表情）
      - torch>=2.2
      - numpy>=1.26
      - librosa>=0.10
      - scipy>=1.10
      # llm：OpenAI 兼容接口（--chat / --llm 真模型）
      - openai>=1.0
      # nlp：文本句向量回归（STTextAffectRegressor）
      - sentence-transformers>=2.2
      # steer：开放权重 VA steering
      - transformers>=4.40
