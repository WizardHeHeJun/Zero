# 情感表达多 Agent 系统 — 编排（app + neo4j 长期记忆；postgres 服务预留）。
# 本机无 Docker，仅作部署脚手架；在装有 Docker 的服务器上 `docker compose up`。
# ⚠ 运行态后端用 sqlite：postgres 尚未接线（异步图需 AsyncPostgresSaver，须在异步入口
#    await 构造 + await setup()），选中即在会话构造时抛 NotImplementedError、不回退。
#    下方 postgres 服务与 ZERO_PG_DSN 作为接线后的预留，暂不生效。
services:
  app:
    build: .
    depends_on:
      - postgres
      - neo4j
    environment:
      ZERO_CHECKPOINT_BACKEND: sqlite
      ZERO_CHECKPOINT_DB: /app/data/checkpoints.sqlite3
      # postgres 接线后改回 ZERO_CHECKPOINT_BACKEND: postgres 并取消下行注释
      # ZERO_PG_DSN: postgresql://postgres:postgres@postgres:5432/zero
      # 长期记忆走 Neo4j（裸 Cypher 适配器，保时序失效语义）；连接参数对齐下方 neo4j 服务
      ZERO_MEMORY_BACKEND: neo4j
      ZERO_NEO4J_URI: bolt://neo4j:7687
      ZERO_NEO4J_USER: neo4j
      ZERO_NEO4J_PASSWORD: password
      # 可选：语义记忆侧信道（Graphiti，深度集成）。与上方确定性后端正交、默认关。
      # 开启需 app 装 graphiti extra（pip install -e ".[graphiti]"）+ OpenAI 兼容 LLM；
      # Graphiti 复用上方同一 neo4j 实例（ZERO_NEO4J_*）。取消注释即启用：
      # ZERO_SEMANTIC_BACKEND: graphiti
      # ZERO_GRAPHITI_MODEL: gpt-4o-mini
      # ZERO_OPENAI_BASE_URL: https://api.openai.com/v1
      # ZERO_OPENAI_API_KEY: sk-...
    volumes:
      - app_data:/app/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zero
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  app_data:
  pg_data:
  neo4j_data:
