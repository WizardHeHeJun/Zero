[project]
name = "affective-expression"
version = "0.1.0"
description = "情感表达多 Agent 系统（研究原型/骨架）"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff",
    "mypy",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
