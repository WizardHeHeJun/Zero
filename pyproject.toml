[project]
name = "affective-expression"
version = "0.2.0"
description = "情感表达多 Agent 系统（研究原型/骨架）"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=1.2",
    "pydantic>=2",
]

[project.optional-dependencies]
# 真网络化（ExpressionAgent 等占位的可训练替换）；本机用 conda env affective-expression 安装。
ml = [
    "torch>=2.2",
    "numpy>=2",
    "librosa>=0.10",
    "scipy>=1.10",
]
# 真后端（容器化部署）：运行态 Postgres/SQLite saver + 长期记忆 Neo4j 驱动
db = [
    "langgraph-checkpoint-sqlite",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]>=3",
    "neo4j>=6",
]
# 真语言层：OpenAI 兼容接口 adapter（编排层默认不依赖，注入 OpenAILanguageModel 时才需）
llm = [
    "openai>=2",
]
# zero-link MCP server：把 ConversationSession 包成 MCP 三工具（open/step/close）供 MCP 侧 client 接。
# 边界适配层（三层之外），默认**不入 core**（守零依赖基线）；起 src/mcp_server 时才需。
mcp = [
    "mcp>=1.28",
    "uvicorn>=0.30",  # streamable-http 传输运行时依赖（__main__ http 分支 uvicorn.run）
]
# 语义记忆侧信道（深度集成）：Graphiti（LLM 抽实体/关系入图 + 语义/向量检索；自带 neo4j/openai）。
# 与确定性 GraphStore 并存、默认关；置 ZERO_SEMANTIC_BACKEND=graphiti 时才需。
# kuzu = 嵌入式图库（ZERO_GRAPHITI_DB=kuzu），本地无服务/无 Docker 即可验证；
# ⚠ upstream 已 deprecated（未来会被 graphiti-core 移除）——仅作本地 smoke，持久/生产用 neo4j；
# 若某天新版 graphiti-core 移除 kuzu 驱动，把 graphiti-core 钉到最后支持的版本即可。
graphiti = [
    "graphiti-core>=0.3",
    "kuzu>=0.6",
    "python-dotenv>=1.0",  # 便捷：scripts/verify_graphiti_local 可自动加载 .env（库代码不依赖）
]
# 语音表现出口（TtsSpeechSink 经 HTTP 调本地 Bert-VITS2）：ZERO_TTS_SINK 开启时才需；
# 默认路径/测试（fake HTTP）不依赖。Bert-VITS2 本体装在独立环境，不进本表。
tts = [
    "httpx>=0.27",
]
# 语音输入（--chat 的 push-to-talk 麦克风转写）：ZERO_ASR_INPUT 开启时才需；
# 默认路径/测试（fake model）不依赖。
asr = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
]
# 文本输入侧句向量化：把 TextAffectRegressor 的哈希词袋换成预训练句向量编码器（冻结、只训 MLP 头），
# 带语义泛化、跨域更稳。独立于 ml（避免 transformers 几百 MB 拖重 ml）；默认词袋版不引入。
# 训练/推理句向量版（STTextAffectRegressor / train_text_affect_st）时才需。
nlp = [
    "sentence-transformers>=5",
]
# 表示空间 steering（输出侧）：把 e*=(v,a) 作为 steering 坐标加到开放权重 LM 的隐状态。
# 注入 SteeringLanguageModel 且用默认 transformers 后端时才需；编排层/默认路径不依赖。
steer = [
    "torch>=2.2",
    "transformers>=5",
    "numpy>=2",
]
# 数据集预处理（外部人脸数据集 → labels_ext.csv 训练输入）：读 parquet(HuggingFace 数据集)抽图。
# 仅跑 scripts/build_emonet_dataset 等数据合成脚本时需；运行态/默认/训练循环不依赖。
data = [
    "pyarrow>=15",
    "pillow>=10",
    "huggingface-hub>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1",
    "ruff",
    "mypy",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # 第三方 audioread（librosa 依赖）在 Py3.12 导入已弃用的 aifc/audioop/sunau
    "ignore::DeprecationWarning:audioread",
    "ignore:'aifc' is deprecated:DeprecationWarning",
    "ignore:'audioop' is deprecated:DeprecationWarning",
    "ignore:'sunau' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
