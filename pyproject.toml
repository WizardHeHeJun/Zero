[project]
name = "affective-expression"
version = "0.1.0"
description = "情感表达多 Agent 系统（研究原型/骨架）"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2",
]

[project.optional-dependencies]
# 真网络化（ExpressionAgent 等占位的可训练替换）；本机用 conda env affective-expression 安装。
ml = [
    "torch>=2.2",
    "numpy>=1.26",
    "librosa>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff",
    "mypy",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # 第三方 audioread（librosa 依赖）在 Py3.12 导入已弃用的 aifc/audioop/sunau
    "ignore::DeprecationWarning:audioread",
    "ignore:'aifc' is deprecated:DeprecationWarning",
    "ignore:'audioop' is deprecated:DeprecationWarning",
    "ignore:'sunau' is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
